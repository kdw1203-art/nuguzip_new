# Vercel 자동 배포
# - main 브랜치 푸시 → 프로덕션 (nuguzip.com)
# - 그 외 브랜치 푸시 → 프리뷰 URL
# 필요 시크릿: VERCEL_TOKEN (저장소 Settings → Secrets → Actions)
name: Deploy to Vercel

on:
  push:
    # main = 프로덕션. 스테이징 미러(design-revamp)는 main과 동일 커밋이라
    # 중복 배포·실패 이슈 노이즈만 생겨 제외 — 프리뷰가 필요한 브랜치만 추가.
    branches: ["main"]

env:
  VERCEL_ORG_ID: team_HEspqLpVXaHn1GHTEjqbSZ2E
  VERCEL_PROJECT_ID: prj_hsE8uEG7QyxefafQpVnKx6diCVqO
  SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  CRS: ${{ secrets.CRON_SECRET }}
  CODEF_ID: ${{ secrets.CODEF_CLIENT_ID }}
  CODEF_SECRET: ${{ secrets.CODEF_CLIENT_SECRET }}
  CODEF_PUB: ${{ secrets.CODEF_PUBLIC_KEY }}
  ECOS_KEY: ${{ secrets.ECOS_API_KEY }}
  ONBID_KEY: ${{ secrets.ONBID_SERVICE_KEY }}

permissions:
  contents: read
  issues: write

# 같은 브랜치의 배포는 한 번에 하나만. 새 푸시가 오면 앞선 실행을 취소한다.
#
# 이걸 넣는 이유(2026-07-26 실제 사고): DB 가 느려진 사이 시작된 배포 실행이
# 링크 점검 단계에서 3시간 동안 멈춰 있었다. 그 뒤에 최신 코드로 배포가 성공해도,
# 멈춰 있던 옛 실행이 나중에 깨어나 성공하면 **두 단계 전 코드가 운영에 덮인다.**
# 동시 실행 그룹이 없으면 "나중에 끝난 쪽이 이긴다"가 되어 배포 순서가 커밋
# 순서와 무관해진다. cancel-in-progress 로 항상 최신 커밋이 이기게 만든다.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 기본값은 360분이다. 링크 점검이 멈추면 러너 하나를 6시간 붙잡고 있다가
    # 실패하는데, 그 6시간 동안 아무도 "멈췄다"는 사실을 알 수 없다.
    # 정상 배포는 10분 안쪽이므로 35분이면 넉넉하고, 넘으면 그건 고장이다.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks 이력 스캔을 위해 전체 히스토리 필요
          fetch-depth: 0
      # ---- 시크릿 스캔 (#94): 유출 감지 시 빌드 중단 ----
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # ---- Next.js 빌드 캐시 (2026-07-26) ----
      # 이 파이프라인은 Next 를 두 번 빌드한다(링크 점검용 next build + vercel build).
      # 두 번째는 첫 번째가 남긴 .next/cache 를 그대로 쓰지만, 러너는 매번 새 머신이라
      # **첫 번째 빌드는 항상 캐시가 빈 상태**에서 시작했다. 여기서 .next/cache 를
      # 실행 간에 실어 나르면 그 첫 빌드가 이전 실행의 컴파일 결과를 재사용한다.
      # 캐시가 없거나 깨져도 빌드는 그냥 처음부터 돌 뿐이라 실패로 이어지지 않는다.
      # (npm ci 앞에 두는 이유: node_modules 가 아직 없어야 hashFiles 가 빠르다.)
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-nextjs-
      # ---- 품질 게이트 (#27): 링크 무결성 검사 ----
      # vercel build 산출물(.vercel/output)로는 next start가 불가하므로
      # 검사용 next build를 1회 별도 수행 (빌드 2회 허용 — 안정성 우선)
      - name: Install dependencies
        run: npm ci
      # ---- 시크릿 스캐너 표식 재확인 (로컬에서도 같은 검사를 돌릴 수 있게) ----
      # 위 gitleaks 스텝은 CI 에서만 돈다. 그래서 2026-07-26 에 주석 속 PEM 머리글
      # 한 줄이 배포를 51초 만에 죽였는데, 로그를 열기 전에는 원인이 안 보였다.
      # 같은 규칙을 npm run check:secret-markers 로 로컬에서 돌릴 수 있게 해 두고,
      # 여기서도 한 번 더 확인한다 — 두 검사가 어긋나면 그 자체가 신호다.
      - name: Secret marker lint (local-runnable mirror)
        run: node scripts/check-secret-markers.mjs
      # ---- 정적 린트: drop 한 뷰/MV 에 GRANT 를 다시 줬는가 ----
      # DROP MATERIALIZED VIEW 는 GRANT 를 같이 지우는데 CREATE OR REPLACE 가 없어
      # 재부여를 잊기 쉽다. 2026-07-25 에 이걸 빠뜨려 /tx 가 하루 죽었다.
      - name: Migration grant lint
        run: node scripts/check-migration-grants.mjs
      # ---- 정적 린트: Icon name 이 실제로 존재하는가 ----
      # Icon 은 name 을 string 으로 받고, 매핑에 없는 이름은 **그 글자를 그대로**
      # 화면에 찍는다(이모지 무손실 폴백의 부작용). 타입 검사도 빌드도 통과한다.
      # 2026-07-26 에 name="alert" 가 아이콘 대신 "alert" 라는 단어로 렌더됐다.
      - name: Icon name lint
        run: node scripts/check-icon-names.mjs
      # ---- 정적 린트: 색 토큰이 본문 대비 4.5:1 을 넘는가 ----
      # globals.css 의 15b 주석은 "bg 위 text 대비 4.5:1"을 규칙으로 적어 두었는데
      # 2026-07-27 확인 결과 --danger 만 어느 배경에서도 그걸 못 넘고 있었다
      # (흰 배경 4.38 · danger-soft 3.77). text-danger 는 소스 91곳에 쓰인다.
      # a11y e2e 는 "렌더된 화면"만 보므로 아직 안 쓰인 조합은 못 잡는다.
      - name: Color token contrast lint
        run: node scripts/check-contrast-tokens.mjs
      # ---- 정적 린트: href 가 실존하는 라우트를 가리키는가 ----
      # 링크는 틀려도 타입 검사·빌드가 안 깨진다. 링크 크롤 게이트는 렌더된 <a>
      # 만 따라가므로 API 응답 속 url·로그인 화면·죽은 모듈은 닿지 않는다.
      # 2026-07-26 전수 점검에서 홈 퀵메뉴 "청약"(/presale), 지도 허브 "매물"
      # (/map/listings), 내 활동 북마크, /admin/ops 지표 카드가 전부 404 였다.
      - name: Route link lint
        run: node scripts/check-route-links.mjs
      # ---- 실조회 게이트: public.*_source 뷰를 실제로 읽어 본다 ----
      # security_invoker 뷰라 래퍼 GRANT 로는 가려지지 않는다 — 타입 검사도
      # 빌드도 통과하지만 런타임에 42501 로 죽는 구멍을 여기서 막는다.
      # 접속 불가·프록시 차단이면 SKIP(초록으로 위장하지 않고 "확인 못 함"으로 남긴다).
      - name: Source view permission check
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-source-views.mjs
      - name: Build for link check
        # prerender 는 DB 를 읽는다. DB 가 느려지면 빌드가 조용히 길어지는데,
        # 잡 상한(35분)만 있으면 "빌드가 먹었다"는 사실이 로그 끝까지 가야 보인다.
        # 정상 빌드는 5분 안쪽이다 — 15분을 넘으면 그건 고장이다.
        # (조회 자체의 상한은 lib/newui/supabase-read.ts 에 요청당 25초로 있다.)
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          npx next build 2>&1 | tee build.log
      # ---- 번들 예산 (#4): 라우트별 First Load JS 250kB 초과 경고 (실패시키지 않음) ----
      - name: Bundle budget check (First Load JS <= 250kB, warn only)
        run: |
          if [ ! -f build.log ]; then
            echo "build.log not found — skipping bundle budget check"
            exit 0
          fi
          # next build 라우트 표에서 "<tree> <symbol> /route ... <size> <unit> <firstLoad> <unit>" 행 파싱
          awk '
            $3 ~ /^\// && NF >= 5 && $NF ~ /^(B|kB|MB)$/ {
              unit = $NF; val = $(NF-1) + 0;
              if (unit == "MB") kb = val * 1024;
              else if (unit == "kB") kb = val;
              else kb = val / 1024;
              if (kb > 250) {
                over++;
                printf "::warning title=Bundle budget::First Load JS %s %s exceeds 250 kB budget: %s\n", $(NF-1), unit, $3;
              }
            }
            END {
              if (over) printf "%d route(s) over the 250 kB First Load JS budget (warning only)\n", over;
              else print "All routes within the 250 kB First Load JS budget";
            }
          ' build.log
      # ---- G5: 공개 CDN 캐시 허용 목록이 실제 prerender 산출물과 맞는지 검증 ----
      # 목록에 있는 경로가 동적 렌더로 바뀌면 사용자별 응답이 공유 캐시에 섞일 수 있으므로
      # 배포 전에 실패시킨다. (lib/http/cache-policy.ts)
      - name: Cache policy check
        run: node scripts/check-cache-policy.mjs
      # ---- N8: 구조화 데이터(JSON-LD) 검증 ----
      # 이 스크립트는 예전부터 있었지만 package.json 에만 있고 어떤 워크플로에도
      # 연결돼 있지 않았다 — 즉 한 번도 실행된 적이 없다. 그 사이 탐색경로 스키마의
      # item(URL) 누락이 배포돼 Search Console 이 잡아냈다(2026-07-27). 게이트는
      # 돌아야 게이트다.
      - name: Structured data (JSON-LD) check
        run: node scripts/check-jsonld.mjs
      # ---- 장식용 컨트롤 게이트 ----
      # 2026-07-27, 런칭 준비 중에 가입 화면의 "⌕ 검색"이 onClick 없는 <span> 인 게
      # 발견됐다. 전수 조사에서 같은 종류가 40곳 넘게 나왔다 — 핸들러 없는 <button>,
      # 탭인 척하는 <span>, `▾` 만 그린 가짜 드롭다운. 타입도 테스트도 통과하고
      # 화면도 멀쩡해서 사람 리뷰로는 안 걸린다. 기계가 봐야 재발을 막는다.
      - name: Dead control check
        run: node scripts/check-dead-controls.mjs
      - name: Link integrity check
        # 스텝 단위 상한도 따로 둔다. 잡 상한(35분)만 있으면 어느 스텝이 잡아먹었는지
        # 로그를 끝까지 뒤져야 알 수 있는데, 여기서 끊기면 원인이 바로 드러난다.
        timeout-minutes: 12
        run: |
          npx next start -p 3100 &
          SERVER_PID=$!
          # 서버 기동 대기 (최대 60초)
          for i in $(seq 1 60); do
            if curl -sfo /dev/null http://localhost:3100/; then break; fi
            sleep 1
          done
          PORT=3100 node scripts/check-links.mjs
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS
      # ---- 기존 Vercel 배포 단계 (그대로 유지) ----
      # 공개 Supabase 값 정정 — 프로젝트 env에 "[SENSITIVE]" 플레이스홀더가
      # 저장돼 있던 문제 수정 (URL·publishable 키는 공개 정보, RLS로 보호)
      - name: Sync public Supabase env
        run: |
          for ENVTARGET in production preview; do
            npx vercel env rm NEXT_PUBLIC_SUPABASE_URL $ENVTARGET --yes --token=${{ secrets.VERCEL_TOKEN }} 2>/dev/null || true
            printf 'https://pbhiskvwpwwhtkmnhkbm.supabase.co' | npx vercel env add NEXT_PUBLIC_SUPABASE_URL $ENVTARGET --token=${{ secrets.VERCEL_TOKEN }} || true
            npx vercel env rm NEXT_PUBLIC_SUPABASE_ANON_KEY $ENVTARGET --yes --token=${{ secrets.VERCEL_TOKEN }} 2>/dev/null || true
            printf 'sb_publishable_UjkQXcYY6f9oBbjjfZvFAA_jYpui-OX' | npx vercel env add NEXT_PUBLIC_SUPABASE_ANON_KEY $ENVTARGET --token=${{ secrets.VERCEL_TOKEN }} || true
          done
      # Service Role 키 동기화 — GitHub Secret(SUPABASE_SERVICE_ROLE_KEY)이
      # 설정돼 있을 때만 Vercel env의 마스킹 값("[SENSITIVE]")을 실값으로 교체
      - name: Sync service role env
        if: ${{ env.SRK != '' }}
        run: |
          npx vercel env rm SUPABASE_SERVICE_ROLE_KEY production --yes --token=${{ secrets.VERCEL_TOKEN }} 2>/dev/null || true
          printf '%s' "$SRK" | npx vercel env add SUPABASE_SERVICE_ROLE_KEY production --token=${{ secrets.VERCEL_TOKEN }} || true
      # CRON_SECRET 동기화 — ETL 스케줄러(etl.yml)가 같은 값으로 크론 엔드포인트 호출
      - name: Sync cron secret env
        if: ${{ env.CRS != '' }}
        run: |
          npx vercel env rm CRON_SECRET production --yes --token=${{ secrets.VERCEL_TOKEN }} 2>/dev/null || true
          printf '%s' "$CRS" | npx vercel env add CRON_SECRET production --token=${{ secrets.VERCEL_TOKEN }} || true
      # CODEF 자격 증명 동기화 — GitHub Secret 설정 시에만 Vercel env로 반영
      # (KB 시세·공시가격 등 CODEF 연동 활성화. 미설정이면 스킵)
      - name: Sync CODEF credentials
        if: ${{ env.CODEF_ID != '' }}
        run: |
          for KEY in CODEF_CLIENT_ID CODEF_CLIENT_SECRET CODEF_PUBLIC_KEY; do
            npx vercel env rm $KEY production --yes --token=${{ secrets.VERCEL_TOKEN }} 2>/dev/null || true
          done
          printf '%s' "$CODEF_ID"     | npx vercel env add CODEF_CLIENT_ID production --token=${{ secrets.VERCEL_TOKEN }} || true
          printf '%s' "$CODEF_SECRET" | npx vercel env add CODEF_CLIENT_SECRET production --token=${{ secrets.VERCEL_TOKEN }} || true
          printf '%s' "$CODEF_PUB"    | npx vercel env add CODEF_PUBLIC_KEY production --token=${{ secrets.VERCEL_TOKEN }} || true
      # ECOS(한국은행) 인증키 동기화 — 설정 시 기준금리 등 지표 자동 연동
      - name: Sync ECOS key
        if: ${{ env.ECOS_KEY != '' }}
        run: |
          npx vercel env rm ECOS_API_KEY production --yes --token=${{ secrets.VERCEL_TOKEN }} 2>/dev/null || true
          printf '%s' "$ECOS_KEY" | npx vercel env add ECOS_API_KEY production --token=${{ secrets.VERCEL_TOKEN }} || true
      # 온비드(공공데이터포털) 인증키 동기화 — 서울 공매 물건 연동
      - name: Sync ONBID key
        if: ${{ env.ONBID_KEY != '' }}
        run: |
          npx vercel env rm ONBID_SERVICE_KEY production --yes --token=${{ secrets.VERCEL_TOKEN }} 2>/dev/null || true
          printf '%s' "$ONBID_KEY" | npx vercel env add ONBID_SERVICE_KEY production --token=${{ secrets.VERCEL_TOKEN }} || true
      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=${{ github.ref_name == 'main' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: npx vercel build ${{ github.ref_name == 'main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        shell: bash
        run: |
          set -o pipefail
          # --archive=tgz: 무료 플랜 24h 업로드 파일 수(5000) 한도 대응 — 아카이브 1개로 업로드
          npx vercel deploy --prebuilt --archive=tgz ${{ github.ref_name == 'main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee deploy.log
      - name: Report deploy failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAIL=$(tail -c 3000 deploy.log 2>/dev/null || echo "no log")
          gh api repos/${{ github.repository }}/issues -f title="Deploy failure $(date -u +%FT%TZ)" -f body="run: ${{ github.run_id }}
          \`\`\`
          $TAIL
          \`\`\`" || true
