# E2E 스모크 (#92)
# - main 푸시·수동 실행 시 프로덕션 빌드를 로컬 기동 후 Playwright 스모크 30케이스 실행
# - 배포 워크플로(deploy.yml)와 완전 독립 — 배포를 막거나 수정하지 않음
# - 실패 시 이슈 자동 생성 (synthetic.yml 실패 리포트 패턴)
name: E2E Smoke

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# 연속 푸시 때 옛 커밋의 스모크가 계속 도는 것을 막는다 — 결과는 어차피 최신
# 커밋 기준만 의미가 있다(deploy.yml 과 같은 패턴).
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # 정상 실행은 10분 안쪽. 기본 상한(360분)이면 Playwright 가 멈췄을 때
    # 러너를 6시간 붙잡는다(deploy.yml 이 35분으로 줄인 것과 같은 이유).
    timeout-minutes: 30
    steps:
      # SHA 핀 — deploy.yml 과 같은 공급망 원칙 (ls-remote 로 2026-08-03 확인)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # 링크 점검과 같은 이유(deploy.yml 참고) — CI 일회용 서버 부팅을 위한 더미.
      - name: Build
        env:
          AUTH_SECRET: ci-linkcheck-only-dummy-secret-not-used-in-production-1234567890
        run: npx next build
      - name: Start server and run E2E smoke
        shell: bash
        env:
          AUTH_SECRET: ci-linkcheck-only-dummy-secret-not-used-in-production-1234567890
        run: |
          # ⚠️ pipefail 을 지우지 말 것. 아래 playwright 호출은 tee 로 파이프되므로
          #    pipefail 이 없으면 $? 가 항상 tee 의 0 이 되고, 이 게이트는 무슨 일이
          #    있어도 초록으로 끝난다(= 게이트가 아니게 된다).
          set -o pipefail
          npx next start -p 3345 &
          SERVER_PID=$!
          # 서버 기동 대기 (최대 60초) — deploy.yml link-check 패턴
          for i in $(seq 1 60); do
            if curl -sfo /dev/null http://localhost:3345/; then break; fi
            sleep 1
          done
          # 검사 대상 라우트를 한 번씩 미리 친다. 갓 기동한 서버에 워커가 한꺼번에
          # 붙으면 첫 요청들이 서로 밀려 스타일 적용 전에 단언이 도는 경우가 있었다.
          for P in / /notes /town /search /subscription /login /offline; do
            curl -sfo /dev/null "http://localhost:3345$P" || true
          done
          E2E_BASE_URL=http://localhost:3345 npx playwright test 2>&1 | tee e2e.log
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS
      # 실패 리포트는 이슈 하나를 재사용한다.
      # 예전엔 실패할 때마다 새 이슈를 팠다. 한 가지 원인(쿠키 동의 배너가 설치
      # 프롬프트 클릭을 가로챔)으로 12개 이슈와 메일이 쌓여, 정작 새로운 실패가
      # 묻혔다. 열려 있는 리포트가 있으면 코멘트만 달고, 없을 때만 새로 연다.
      - name: Report E2E failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAIL=$(tail -c 3000 e2e.log 2>/dev/null || echo "no log")
          BODY="run: ${{ github.run_id }} ($(date -u +%FT%TZ))

          \`\`\`
          $TAIL
          \`\`\`"
          EXISTING=$(gh issue list --repo ${{ github.repository }} \
            --label e2e-failure --state open --limit 1 --json number \
            --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo ${{ github.repository }} --body "$BODY" || true
          else
            gh label create e2e-failure --repo ${{ github.repository }} \
              --color B60205 --description "E2E 스모크 실패 리포트" 2>/dev/null || true
            gh issue create --repo ${{ github.repository }} \
              --title "E2E smoke failure" --label e2e-failure --body "$BODY" || true
          fi

      # 초록으로 돌아오면 열려 있던 리포트를 자동으로 닫는다 — 사람이 기억해서
      # 닫아야 하는 상태를 남기지 않는다.
      - name: Close E2E failure report on success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for N in $(gh issue list --repo ${{ github.repository }} \
            --label e2e-failure --state open --limit 20 --json number \
            --jq '.[].number' 2>/dev/null); do
            gh issue close "$N" --repo ${{ github.repository }} \
              --comment "run ${{ github.run_id }} 통과 — 자동 종료" || true
          done
