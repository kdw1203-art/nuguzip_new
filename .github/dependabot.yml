# 의존성 자동 갱신 (Dependabot)
#
# 왜 두나: 2026-07-27 감사에서 next-auth 가 CRITICAL 권고 두 건(그중 하나는
# 인증 검사가 fail-open 되는 결함)이 난 뒤로도 몇 달째 옛 beta 에 고정돼 있었다.
# 사람이 주기적으로 확인하는 방식은 이미 한 번 실패했으므로, 주 1회 PR 로 사실이
# 저장소에 먼저 도착하게 한다.
#
# minor·patch 는 한 PR 로 묶는다 — 리뷰 대상을 하나로 만들어야 실제로 읽힌다.
# major 는 묶지 않는다(깨지는 변경은 따로 봐야 한다).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # 워크플로가 쓰는 액션(checkout·setup-node·gitleaks 등)도 같이 본다.
  # 액션은 태그를 옮겨 달 수 있어 오히려 갱신 누락이 눈에 안 띈다.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
