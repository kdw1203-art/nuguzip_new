<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>내집나우 이메일 인증</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        color: #1a1f2e;
        background: #f6f8fb;
      }
      p {
        font-size: 15px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <p>이메일 인증을 처리하는 중…</p>
    <script>
      (function () {
        var target = "https://nuguzip.com/auth/confirm";
        var q = window.location.search || "";
        var h = window.location.hash || "";
        window.location.replace(target + q + h);
      })();
    </script>
  </body>
</html>
